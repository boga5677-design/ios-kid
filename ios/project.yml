name: PetLingoKids
options:
  bundleIdPrefix: com.petlingo
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  PetLingoKids:
    type: application
    platform: iOS
    sources:
      - path: PetLingoKids
        excludes:
          - Resources
    resources:
      - path: PetLingoKids/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petlingo.kids.ios
        PRODUCT_NAME: PetLingo Kids
        INFOPLIST_FILE: PetLingoKids/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
    scheme:
      gatherCoverageData: false
