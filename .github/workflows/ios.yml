name: Build PetLingo iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Show Project
        run: |
          pwd
          xcodebuild -list -project PetLingoKids.xcodeproj

      - name: Build
        run: |
          set -eo pipefail

          rm -rf "$GITHUB_WORKSPACE/DerivedData"

          xcodebuild \
            -project PetLingoKids.xcodeproj \
            -scheme PetLingoKids \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package App
        run: |
          set -eo pipefail

          PRODUCTS="$GITHUB_WORKSPACE/DerivedData/Build/Products/Debug-iphonesimulator"
          echo "Build products:"
          find "$PRODUCTS" -maxdepth 2 -type d -name "*.app" -print || true

          APP=$(find "$PRODUCTS" -maxdepth 1 -type d -name "*.app" | head -1)

          echo "APP=$APP"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "No simulator .app found in $PRODUCTS"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP" PetLingo-iOS-Simulator.zip
          ls -lh PetLingo-iOS-Simulator.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetLingo-iOS-Simulator
          path: PetLingo-iOS-Simulator.zip
