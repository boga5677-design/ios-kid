name: Build PetLingo iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Show Project
        run: |
          pwd
          ls -R
          xcodebuild -list -project PetLingoKids.xcodeproj

      - name: Build
        run: |
          set -eo pipefail

          xcodebuild \
            -project PetLingoKids.xcodeproj \
            -scheme PetLingoKids \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Find App
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
          -name "PetLingo Kids.app" \
          | head -1)

          echo "APP=$APP"

          if [ -z "$APP" ]; then
            echo "App not found"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
          "$APP" \
          PetLingo-iOS-Simulator.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PetLingo-iOS-Simulator
          path: PetLingo-iOS-Simulator.zip
